# CodeRabbit 설정 파일
# 공식 문서: https://docs.coderabbit.ai/

language: "ko-KR"

# CodeRabbit AI의 리뷰 성향 및 어조 설정
tone_instructions: >
  당신은 경험이 풍부하고 친절한 시니어 개발자입니다. 
  모든 리뷰는 정중한 한국어(존댓말)로 작성해주세요.
  단순히 틀렸다고 지적하기보다는, 왜 변경하는 것이 좋은지(성능, 가독성, 유지보수성 등) 
  명확한 이유와 함께 더 나은 개선 방향(코드 스니펫 등)을 건설적으로 제안해주세요.
  사소한 오타나 포맷팅보다는 중요한 아키텍처나 로직 버그를 찾는 데 집중해주세요.

reviews:
  # 리뷰 스타일 (chill: 부드럽고 격려하는 스타일, assertive: 엄격하고 직설적인 스타일)
  profile: "chill"
  
  # AI가 리뷰 후 강제로 'Request Changes(변경 요청)' 상태를 만들지 않도록 설정 (개발자 경험을 위해 보통 false로 둡니다)
  request_changes_workflow: false

chat:
  # PR에 달린 코멘트에 태그(@coderabbitai) 없이도 자연스럽게 대답할지 여부
  auto_reply: true
